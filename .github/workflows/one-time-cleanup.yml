name: One-time repository cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  delete-pre-reset-branches:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Delete pre-reset branch refs
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'codex/configure-deployment-on-vercel-and-railway'
            'copilot/add-artifact-extractor-ui-update'
            'copilot/fix-docker-container-startup-issue'
            'copilot/fix-fastapi-entrypoint-error'
            'copilot/fix-netlify-connection-issue'
            'copilot/rebrand-robin-to-zebrabyte'
            'feat/cloudflare-native-darkweb'
            'fix-docker-ui-startup'
            'migration/cloudflare-containers-v1'
            'vercel-export'
          )
          for branch in "${branches[@]}"; do
            git push origin --delete "$branch" || true
          done
