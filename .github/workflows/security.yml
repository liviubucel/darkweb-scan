name: Security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q collector
      - run: python -m pip install --disable-pip-version-check pip-audit
      - run: pip-audit -r collector/requirements.txt
      - name: Reject committed secrets
        shell: bash
        run: |
          if git grep -nEi '(api[_-]?key|secret|token)[[:space:]]*=[[:space:]]*["'"'][A-Za-z0-9_./+-]{16,}' -- ':!*.md'; then
            echo "Potential hard-coded credential detected"
            exit 1
          fi
