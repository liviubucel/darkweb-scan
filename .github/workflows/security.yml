name: Security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.15"
      - run: bun install
      - run: bun run typecheck
      - name: Validate Wrangler configuration and bundle
        run: bun run deploy:dry
      - run: bun audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q collector
      - run: python -m pip install --disable-pip-version-check pip-audit
      - run: pip-audit -r collector/requirements.txt
      - name: Reject unresolved production placeholders
        shell: bash
        run: |
          if grep -nE 'REPLACE_[A-Z0-9_]+' wrangler.jsonc; then
            echo "Unresolved production placeholder detected in wrangler.jsonc"
            exit 1
          fi
      - name: Reject committed secrets
        shell: bash
        run: |
          if git grep -nEi '(api[_-]?key|secret|token)[[:space:]]*=[[:space:]]*["'"'][A-Za-z0-9_./+-]{16,}' -- ':!*.md'; then
            echo "Potential hard-coded credential detected"
            exit 1
          fi
      - name: Reject pre-reset project markers
        shell: bash
        run: |
          if git grep -nEi '(robin|apurvsg|apurvsinghgautam|vercel|railway|streamlit|netlify)' -- ':!bun.lock' ':!.github/workflows/security.yml'; then
            echo "Pre-reset project/platform marker detected"
            exit 1
          fi
