services:
  # Robin Web Service
  - type: web
    name: robin-darkweb-osint
    env: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: python main.py ui --ui-port $PORT --ui-host 0.0.0.0
    healthCheckPath: /_stcore/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        value: ""
        sync: false
